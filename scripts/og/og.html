<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@700;800&family=Geist:wght@400;500&family=Geist+Mono:wght@500&display=block">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #f2f4f0; color: #121417; font-family: 'Geist', sans-serif; position: relative; overflow: hidden; }
  .wrap { position: absolute; inset: 64px 72px; display: flex; flex-direction: column; }
  .mark { display: flex; align-items: center; gap: 14px; font: 700 30px/1 'Schibsted Grotesk'; letter-spacing: -0.02em; }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: #13704a; box-shadow: 0 0 0 6px #d9ede2; }
  h1 { margin: auto 0 0; font: 800 66px/0.96 'Schibsted Grotesk'; letter-spacing: -0.04em; max-width: 14ch; position: relative; }
  .foot { margin-top: 34px; display: flex; gap: 12px; flex-wrap: wrap; }
  .chip { font: 500 17px/1 'Geist Mono'; letter-spacing: 0.04em; text-transform: uppercase; color: #5a6068; padding: 12px 16px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px #d6dad3; }
  .chip b { color: #13704a; font-weight: 500; }
  .phones { position: absolute; right: 56px; top: 64px; display: flex; align-items: flex-start; gap: 18px; transform: rotate(-4deg); transform-origin: top right; }
  .phone { width: 210px; padding: 7px; border-radius: 34px; background: #0d0e10; box-shadow: 0 0 0 1px rgba(128,128,128,.3), 0 30px 50px -24px rgba(18,20,23,.45); }
  .phone img { display: block; width: 100%; border-radius: 28px; }
  .phone + .phone { margin-top: 70px; }
</style>
</head>
<body>
  <div class="phones">
    <div class="phone"><img src="../../public/work-media/tax-relief-counsel/home-hero--phone-780.webp" alt=""></div>
    <div class="phone"><img src="../../public/work-media/endorphins/home-hero--phone-780.webp" alt=""></div>
  </div>
  <div class="wrap">
    <div class="mark"><span class="dot"></span>Kareem Hassanein</div>
    <h1>From a Google search to a booked appointment, every step working and counted.</h1>
    <div class="foot">
      <span class="chip">Law firms</span>
      <span class="chip">Dental and medical practices</span>
    </div>
  </div>
</body>
</html>
